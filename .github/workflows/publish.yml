# Publishes to npm via Trusted Publishing (OIDC) — no NPM_TOKEN required.
# Configure on npmjs.com → @dookdiks/discord-bot-builder → Trusted Publisher → GitHub Actions:
#   Repository: DookDiks/discord-bot-builder
#   Workflow: publish.yml  (filename only, case-sensitive)
# --provenance requires a public GitHub repository.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (Trusted Publishing requires npm 11.5.1+)
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Do not set NODE_AUTH_TOKEN — npm uses OIDC from GitHub Actions
      - name: Publish to npm
        run: npm publish --provenance --access public
